<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css"><script src="shared.js"></script>
<style>
  body { --w: 1920px; --h: 1300px; }
  .board-body { gap: 140px; }
  .item { display: flex; flex-direction: column; align-items: center; }
  .tote { position: relative; width: 520px; height: 760px; }
  .strap { position: absolute; top: 0; width: 150px; height: 260px; border: 22px solid; border-bottom: 0; border-radius: 75px 75px 0 0; }
  .bag { position: absolute; left: 0; top: 200px; width: 520px; height: 560px; box-shadow: 0 34px 60px -30px rgba(18,27,49,.5); overflow: hidden; }
  .bag::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.025) 0 2px, transparent 2px 4px), repeating-linear-gradient(90deg, rgba(0,0,0,.02) 0 2px, transparent 2px 4px); pointer-events: none; }
  .bag .motif { left: 60px; top: 60px; width: 400px; height: 280px; }
  .bag .in { position: absolute; left: 60px; right: 60px; bottom: 56px; }
  .bag h2 { font-size: 78px; }
</style></head>
<body>
<div class="board">
  <div class="board-head"><h1><span>06</span>Tote Bag</h1><div class="spec">Natural canvas & black canvas · 300 × 320 mm<br>Screen print, 4 spot colours</div></div>
  <div class="board-body">
    <div class="item"><div class="tote">
      <div class="strap" style="left:110px;border-color:#d8cfbd"></div><div class="strap" style="right:110px;border-color:#d8cfbd"></div>
      <div class="bag" style="background:#ece4d3;color:var(--ink)">
        <div class="motif" data-theme="light" data-cell="22" data-ai="0.3,0.55" data-life="0.7,0.45" data-r="0.5"></div>
        <div class="in"><h2 class="display">AI Meets<br><span class="grad-text">Life</span></h2><p class="mono" style="font-size:13px;margin-top:16px">SLSV 2027 · Smart Living Silicon Valley</p></div>
      </div></div><div class="cap">Front · natural canvas</div></div>
    <div class="item"><div class="tote">
      <div class="strap" style="left:110px;border-color:#1a2944"></div><div class="strap" style="right:110px;border-color:#1a2944"></div>
      <div class="bag dark" style="background:#121b31">
        <div class="motif" data-cell="22" data-ai="0.6,0.35" data-life="0.4,0.6" data-r="0.45" data-empty="none"></div>
        <div class="in"><div data-lockup style="--ls:20px"></div><p class="mono" style="font-size:13px;margin-top:22px;opacity:.7">Jan 12 2027 · Computer History Museum · smartlivingsv.com</p></div>
      </div></div><div class="cap">Back · black canvas</div></div>
  </div>
  <div class="board-foot"><span>SLSV 2027 · Material collection</span><span>AI Meets Life</span></div>
</div>
</body></html>
