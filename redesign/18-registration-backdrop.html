<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css"><script src="shared.js"></script>
<style>

  <div class="motif" data-cell="46" data-ai="0.64,0.18" data-life="0.88,0.42" data-ra="0.26" data-rl="0.3"></div>
