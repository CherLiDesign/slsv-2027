<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css"><script src="shared.js"></script>
<style>
  body { --w: 2000px; --h: 200px; background: #e4e8ed; }
  .pen { position: absolute; left: 80px; top: 64px; width: 1800px; height: 72px; }
  .barrel { position: absolute; left: 160px; right: 120px; top: 0; bottom: 0; background: linear-gradient(180deg, #2a2a33 0%, var(--ink) 45%, #050507 100%); border-radius: 10px 36px 36px 10px; box-shadow: 0 16px 30px -14px rgba(0,0,0,.5); display: flex; align-items: center; gap: 36px; padding-left: 300px; color: var(--paper); }
  .grip { position: absolute; left: 40px; width: 140px; top: 6px; bottom: 6px; background: repeating-linear-gradient(90deg, #22222a 0 6px, #111116 6px 10px); border-radius: 6px 0 0 6px; }
  .tip { position: absolute; left: 0; top: 22px; width: 52px; height: 28px; background: linear-gradient(180deg, #d9d6cf, #8d8a84); clip-path: polygon(0 50%, 100% 0, 100% 100%); }
  .band { position: absolute; left: 180px; width: 120px; top: 0; bottom: 0; background: var(--grad); }
  .clip { position: absolute; right: 150px; top: -22px; width: 380px; height: 24px; background: linear-gradient(180deg, #e8e5df, #9c9993); border-radius: 12px 4px 4px 12px; }
  .cap-end { position: absolute; right: 120px; top: 6px; bottom: 6px; width: 40px; background: var(--signal); border-radius: 0 30px 30px 0; transform: translateX(40px); }
  .barrel .lt { font-family: "JetBrains Mono", monospace; font-weight: 700; color: var(--signal); font-size: 26px; letter-spacing: -0.06em; }
  .barrel b { font-weight: 900; font-size: 28px; letter-spacing: -0.03em; }
  .barrel .mono { font-size: 15px; opacity: .7; }
</style></head>
<body>
  <div class="pen">
    <div class="tip"></div><div class="grip"></div>
    <div class="barrel">
      <span class="lt">&lt;/&gt;</span><b>SLSV</b><span class="mono">Expo &amp; Summit</span>
      <span style="flex:0 0 2px;height:28px;background:rgba(244,245,247,.3)"></span>
      <b style="font-size:24px">AI MEETS <span class="grad-text">LIFE</span></b>
      <span class="mono">Jan 12 2027 · smartlivingsv.com</span>
    </div>
    <div class="band"></div>
    <div class="cap-end"></div>
    <div class="clip"></div>
  </div>
</body></html>
